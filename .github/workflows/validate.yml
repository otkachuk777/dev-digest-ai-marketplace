name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace
        run: claude plugin validate .

      - name: Check release consistency
        run: node scripts/check-release.mjs

      - name: Test release scripts
        run: node --test "scripts/test/*.test.mjs"

      - name: Test plugin scripts
        run: |
          for t in plugins/*/scripts/*.test.sh plugins/*/skills/*/scripts/*.test.sh; do
            [ -f "$t" ] || continue
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
          for t in plugins/*/skills/*/scripts/*.test.py; do
            [ -f "$t" ] || continue
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
          done

      - name: Validate behaviour evals
        run: |
          for e in plugins/*/evals/run.mjs; do
            [ -f "$e" ] || continue
            node "$e" --validate
          done

      - name: Validate each plugin
        run: |
          for dir in plugins/*/; do
            [ -f "$dir/.claude-plugin/plugin.json" ] || continue
            echo "::group::$dir"
            claude plugin validate "$dir"
            echo "::endgroup::"
          done

  # Hooks run under Git Bash on Windows: the guards and their tests must pass there too.
  scripts-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check release consistency
        run: node scripts/check-release.mjs

      - name: Test plugin scripts
        run: |
          command -v jq >/dev/null || choco install -y jq
          for t in plugins/*/scripts/*.test.sh plugins/*/skills/*/scripts/*.test.sh; do
            [ -f "$t" ] || continue
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
